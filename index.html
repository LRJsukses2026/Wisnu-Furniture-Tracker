<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wisnu Furniture — Production & PO Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --order-bg: #151f32;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.12);
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      min-height: 100vh;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .brand h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fbbf24;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand p { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }

    .btn-refresh {
      background: #1e293b;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-refresh:hover { background: #334155; }

    .controls { margin-bottom: 24px; }
    .search-box input {
      width: 100%;
      padding: 12px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      font-size: 0.9rem;
    }
    .search-box input:focus { outline: none; border-color: var(--accent); }

    /* FOLDER KLIEN (ACCORDION) */
    .client-folder {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    }
    
    .client-folder-header {
      padding: 18px 20px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      user-select: none;
      transition: background 0.2s;
    }
    .client-folder-header:hover {
      background: rgba(255, 255, 255, 0.06);
    }
    
    .client-info-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .folder-icon {
      font-size: 1.5rem;
    }
    .client-name {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
    }
    .client-subtitle {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .client-info-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .toggle-arrow {
      font-size: 1rem;
      color: var(--muted);
      transition: transform 0.3s ease;
    }
    .client-folder.active .toggle-arrow {
      transform: rotate(180deg);
    }

    /* KONTEN PO DI DALAM FOLDER */
    .client-folder-content {
      display: none;
      padding: 16px;
      border-top: 1px solid var(--border);
      background: #0f172a;
    }
    .client-folder.active .client-folder-content {
      display: block;
    }

    /* KARTU PO / ORDER */
    .order-card {
      background: var(--order-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .order-card:last-child { margin-bottom: 0; }

    .order-header {
      padding: 14px 18px;
      background: var(--accent-glow);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .order-title {
      font-size: 1rem;
      font-weight: 700;
      color: #fbbf24;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .order-meta {
      font-size: 0.78rem;
      color: var(--muted);
    }
    
    .order-stats {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .progress-track {
      width: 100px;
      height: 8px;
      background: #334155;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--success);
      border-radius: 4px;
    }
    .progress-percent {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
    }

    /* GRID BARANG */
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 14px;
      padding: 16px;
    }
    .item-card {
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .item-img-wrap {
      width: 100%;
      height: 150px;
      background: #1e293b;
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }
    .item-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .no-img { font-size: 0.75rem; color: var(--muted); text-align: center; }
    .badge-loc {
      position: absolute;
      top: 8px;
      left: 8px;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      color: #38bdf8;
      text-transform: uppercase;
    }
    .item-content {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .item-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }
    .item-status {
      font-size: 0.8rem;
      font-weight: 600;
      color: #fbbf24;
      margin-bottom: 8px;
    }
    .item-details {
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 12px;
    }
    .item-details span b { color: #e2e8f0; }

    .item-progress-box { margin-top: auto; }
    .item-progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      margin-bottom: 4px;
    }
    .bar-bg {
      height: 6px;
      background: #334155;
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-val {
      height: 100%;
      background: var(--success);
    }

    /* MODAL ZOOM */
    .modal-zoom {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-zoom img { max-width: 95%; max-height: 85vh; border-radius: 8px; }
    .modal-close {
      position: absolute;
      top: 20px;
      right: 25px;
      font-size: 2rem;
      color: #fff;
      cursor: pointer;
    }
    #loading { text-align: center; padding: 40px; color: var(--muted); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">
        <h1>🪵 Wisnu Furniture</h1>
        <p>Sistem Pemantauan Produksi & PO Klien</p>
      </div>
      <button class="btn-refresh" onclick="fetchData()">🔄 Segarkan Data</button>
    </header>

    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cari nama klien, nomor PO, atau nama barang..." oninput="renderDashboard()">
      </div>
    </div>

    <div id="loading">Memuat data dari Google Sheets...</div>
    <div id="dashboard"></div>
  </div>

  <div class="modal-zoom" id="modalZoom" onclick="closeZoom()">
    <span class="modal-close">&times;</span>
    <img id="zoomImg" src="" alt="Detail Foto">
  </div>

  <script>
    // Link CSV Anda sudah terpasang:
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ9ky0C2Atufr8xEasq_SgRJpyJOuFfabsCEBKrIXJp4l1KLTfjcELSyxfNsI-v89HOPsbWsP8YZ-DP/pub?output=csv";

    let allData = [];

    async function fetchData() {
      const loader = document.getElementById('loading');
      loader.style.display = 'block';

      try {
        const res = await fetch(GOOGLE_SHEET_CSV_URL + '&_t=' + new Date().getTime());
        const text = await res.text();
        allData = parseCSV(text);
      } catch (err) {
        console.warn("Gagal memuat:", err);
      }

      loader.style.display = 'none';
      renderDashboard();
    }

    function parseCSV(text) {
      const lines = text.trim().split('\n');
      const list = [];

      for (let i = 1; i < lines.length; i++) {
        const col = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.trim().replace(/^"\vert{}"$/g, ''));
        if (col.length >= 2 && col[0]) {
          list.push({
            customer: col[0],
            orderId: col[1] || "PO Utama",
            item: col[2] || "-",
            qty: parseInt(col[3]) || 1,
            location: col[4] || "Gudang",
            stage: col[5] || "Dalam Proses",
            progress: parseInt(col[6]) || 0,
            artisan: col[7] || "-",
            targetDate: col[8] || "-",
            notes: col[9] || "-",
            photo: col[10] || ""
          });
        }
      }
      return list;
    }

    function renderDashboard() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('dashboard');
      container.innerHTML = '';

      // Struktur Data: Klien -> PO -> Barang
      const groups = {};

      allData.forEach(row => {
        const match = row.customer.toLowerCase().includes(search) ||
                      row.orderId.toLowerCase().includes(search) ||
                      row.item.toLowerCase().includes(search) ||
                      row.artisan.toLowerCase().includes(search);

        if (match) {
          if (!groups[row.customer]) groups[row.customer] = {};
          if (!groups[row.customer][row.orderId]) groups[row.customer][row.orderId] = [];
          groups[row.customer][row.orderId].push(row);
        }
      });

      if (Object.keys(groups).length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 40px; color: #94a3b8;">Belum ada pesanan yang sesuai.</div>';
        return;
      }

      let clientIndex = 0;
      for (const [customer, orders] of Object.entries(groups)) {
        const poCount = Object.keys(orders).length;
        let totalItemsInClient = 0;
        let totalClientProg = 0;

        for (const items of Object.values(orders)) {
          totalItemsInClient += items.length;
          totalClientProg += items.reduce((acc, it) => acc + it.progress, 0);
        }
        const avgClientProg = totalItemsInClient ? Math.round(totalClientProg / totalItemsInClient) : 0;

        const folderEl = document.createElement('div');
        // Folder pertama otomatis terbuka (active) secara default agar langsung terlihat
        folderEl.className = `client-folder ${clientIndex === 0 ? 'active' : ''}`;

        let ordersHtml = '';
        for (const [orderId, items] of Object.entries(orders)) {
          const avgPoProg = Math.round(items.reduce((s, it) => s + it.progress, 0) / items.length);

          ordersHtml += `
            <div class="order-card">
              <div class="order-header">
                <div>
                  <div class="order-title">📦 ${orderId}</div>
                  <div class="order-meta">${items.length} Barang dalam PO ini</div>
                </div>
                <div class="order-stats">
                  <div class="progress-track">
                    <div class="progress-fill" style="width: ${avgPoProg}%"></div>
                  </div>
                  <div class="progress-percent">${avgPoProg}%</div>
                </div>
              </div>

              <div class="items-grid">
                ${items.map(it => `
                  <div class="item-card">
                    <div class="item-img-wrap" onclick="openZoom('${it.photo}')">
                      ${it.photo ? `<img src="${it.photo}" alt="${it.item}">` : `<div class="no-img">📷 Belum ada foto</div>`}
                      <span class="badge-loc">${it.location}</span>
                    </div>
                    <div class="item-content">
                      <div class="item-title">${it.item} (${it.qty} pcs)</div>
                      <div class="item-status">⚙️ ${it.stage}</div>
                      <div class="item-details">
                        <span>📍 Tukang: <b>${it.artisan}</b></span>
                        <span>📅 Target: <b>${it.targetDate}</b></span>${it.notes !== '-' ? `<span>📝 Catatan: ${it.notes}</span>` : ''}
                      </div>
                      <div class="item-progress-box">
                        <div class="item-progress-meta">
                          <span style="color:var(--muted)">Progres</span>
                          <b>${it.progress}%</b>
                        </div>
                        <div class="bar-bg">
                          <div class="bar-val" style="width: ${it.progress}%"></div>
                        </div>
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }

        folderEl.innerHTML = `
          <div class="client-folder-header" onclick="this.parentElement.classList.toggle('active')">
            <div class="client-info-left">
              <div class="folder-icon">📁</div>
              <div>
                <div class="client-name">${customer}</div>
                <div class="client-subtitle">${poCount} PO Aktif • ${totalItemsInClient} Total Barang</div>
              </div>
            </div>
            <div class="client-info-right">
              <span style="font-size:0.85rem; font-weight:700; color:var(--success)">${avgClientProg}% Selesai</span>
              <span class="toggle-arrow">▼</span>
            </div>
          </div>
          <div class="client-folder-content">
            ${ordersHtml}
          </div>
        `;

        container.appendChild(folderEl);
        clientIndex++;
      }
    }

    function openZoom(src) {
      if (!src) return;
      document.getElementById('zoomImg').src = src;
      document.getElementById('modalZoom').style.display = 'flex';
    }

    function closeZoom() {
      document.getElementById('modalZoom').style.display = 'none';
    }

    window.addEventListener('DOMContentLoaded', fetchData);
  </script>
</body>
</html>
